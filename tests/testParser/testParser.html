<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menu Parser Admin</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --panel-2: #1f2937;
      --card: #ffffff;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --accent: #f59e0b;
      --accent-dark: #d97706;
      --success: #22c55e;
      --danger: #ef4444;
      --border: #e5e7eb;
      --shadow: 0 10px 25px rgba(0, 0, 0, 0.18);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background:
        radial-gradient(circle at top left, #1e293b 0%, transparent 30%),
        radial-gradient(circle at top right, #111827 0%, transparent 25%),
        linear-gradient(135deg, #0f172a, #111827);
      color: var(--text);
      min-height: 100vh;
    }

    .container {
      width: min(1200px, 92%);
      margin: 32px auto 60px;
    }

    .hero {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 28px;
      box-shadow: var(--shadow);
      margin-bottom: 28px;
    }

    .hero h1 {
      margin: 0 0 10px;
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .hero p {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 12px;
      margin-top: 22px;
    }

    .input,
    .textarea,
    .select {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid #334155;
      background: #0b1220;
      color: white;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .input:focus,
    .textarea:focus,
    .select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.18);
    }

    .textarea {
      min-height: 90px;
      resize: vertical;
    }

    .btn {
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.2s ease, background 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn:disabled {
      cursor: not-allowed;
      opacity: 0.65;
      transform: none;
    }

    .btn-primary {
      background: var(--accent);
      color: #111827;
    }

    .btn-primary:hover {
      background: var(--accent-dark);
      color: white;
    }

    .btn-success {
      background: var(--success);
      color: white;
    }

    .btn-danger {
      background: var(--danger);
      color: white;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 28px 0 18px;
    }

    .section-header h2 {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 800;
    }

    .status {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 18px;
    }

    .dish-card {
      background: var(--card);
      color: #111827;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .dish-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .dish-card-title {
      font-weight: 800;
      font-size: 1.05rem;
      line-height: 1.2;
      color: #0f172a;
    }

    .confidence-badge {
      white-space: nowrap;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
    }

    .confidence-high {
      background: #dcfce7;
      color: #166534;
    }

    .confidence-mid {
      background: #fef3c7;
      color: #92400e;
    }

    .confidence-low {
      background: #fee2e2;
      color: #991b1b;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field label {
      font-size: 0.82rem;
      font-weight: 700;
      color: #374151;
    }

    .inline-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 4px;
    }

    .checkbox-row input {
      transform: scale(1.15);
    }

    .card-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 6px;
    }

    .footer-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 28px;
    }

    .empty-state {
      padding: 26px;
      border-radius: 20px;
      border: 1px dashed rgba(255,255,255,0.2);
      color: var(--muted);
      text-align: center;
      background: rgba(255,255,255,0.04);
    }

    .raw-box {
      margin-top: 28px;
      background: #020617;
      color: #cbd5e1;
      border-radius: 18px;
      padding: 16px;
      border: 1px solid #1e293b;
      overflow: auto;
      max-height: 280px;
      white-space: pre-wrap;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 760px) {
      .toolbar {
        grid-template-columns: 1fr;
      }

      .inline-2 {
        grid-template-columns: 1fr;
      }

      .footer-actions,
      .section-header {
        flex-direction: column;
        align-items: stretch;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <section class="hero">
      <h1>Menu Parser Admin</h1>
      <p>
        Parse a menu image, review the AI output, edit every field, and save the final dishes to your database.
      </p>

      <div class="toolbar">
        <input
          id="imageInput"
          class="input"
          type="text"
          placeholder="Write the filename inside /images, e.g. Menu.jpeg"
        />
        <button id="parseBtn" class="btn btn-primary" onclick="parseImage()">Parse Menu</button>
        <button class="btn" onclick="addDish()" style="background:#334155;color:white;">+ Add Dish</button>
      </div>
    </section>

    <div class="section-header">
      <h2>Detected dishes</h2>
      <div id="statusText" class="status">Waiting for a menu image...</div>
    </div>

    <div id="cardsContainer" class="grid"></div>

    <div id="emptyState" class="empty-state">
      No dishes loaded yet. Parse an image to generate editable dish cards.
    </div>

    <div class="footer-actions">
      <button class="btn" onclick="toggleRaw()" style="background:#334155;color:white;">Show Raw JSON</button>
      <button id="saveBtn" class="btn btn-success" onclick="saveDishes()" disabled>Guardar</button>
    </div>

    <pre id="rawJsonBox" class="raw-box hidden"></pre>
  </div>

  <script>
    let dishesState = [];
    let rawResponse = null;

    function getConfidenceClass(value) {
      const n = Number(value ?? 0);
      if (n >= 0.9) return "confidence-high";
      if (n >= 0.75) return "confidence-mid";
      return "confidence-low";
    }

    function renderCards() {
      const container = document.getElementById("cardsContainer");
      const emptyState = document.getElementById("emptyState");
      const saveBtn = document.getElementById("saveBtn");
      const statusText = document.getElementById("statusText");

      container.innerHTML = "";

      if (!dishesState.length) {
        emptyState.classList.remove("hidden");
        saveBtn.disabled = true;
        statusText.textContent = "No dishes available.";
        return;
      }

      emptyState.classList.add("hidden");
      saveBtn.disabled = false;
      statusText.textContent = `${dishesState.length} dish(es) ready to review`;

      dishesState.forEach((dish, index) => {
        const card = document.createElement("div");
        card.className = "dish-card";

        card.innerHTML = `
          <div class="dish-card-header">
            <div class="dish-card-title">Dish #${index + 1}</div>
            <div class="confidence-badge ${getConfidenceClass(dish.extraction_confidence)}">
              confidence: ${dish.extraction_confidence ?? ""}
            </div>
          </div>

          <div class="field">
            <label>Name</label>
            <input class="input" value="${escapeHtml(dish.name || "")}" onchange="updateDish(${index}, 'name', this.value)" />
          </div>

          <div class="field">
            <label>Description</label>
            <textarea class="textarea" onchange="updateDish(${index}, 'description', this.value)">${escapeHtml(dish.description || "")}</textarea>
          </div>

          <div class="inline-2">
            <div class="field">
              <label>Price</label>
              <input class="input" type="number" step="0.01" value="${dish.price ?? ""}" onchange="updateDishNumber(${index}, 'price', this.value)" />
            </div>

            <div class="field">
              <label>Category</label>
              <input class="input" value="${escapeHtml(dish.category || "")}" onchange="updateDish(${index}, 'category', this.value)" />
            </div>
          </div>

          <div class="inline-2">
            <div class="field">
              <label>Image URL</label>
              <input class="input" value="${escapeHtml(dish.image_url || "")}" onchange="updateDish(${index}, 'image_url', this.value)" />
            </div>

            <div class="field">
              <label>Tags (comma separated)</label>
              <input class="input" value="${escapeHtml((dish.tags || []).join(', '))}" onchange="updateDishTags(${index}, this.value)" />
            </div>
          </div>

          <div class="inline-2">
            <div class="field">
              <label>Extraction confidence</label>
              <input class="input" type="number" step="0.01" min="0" max="1" value="${dish.extraction_confidence ?? ""}" onchange="updateDishNumber(${index}, 'extraction_confidence', this.value)" />
            </div>

            <div class="field">
              <label>Extraction source</label>
              <input class="input" value="${escapeHtml(dish.extraction_source || "")}" onchange="updateDish(${index}, 'extraction_source', this.value)" />
            </div>
          </div>

          <div class="checkbox-row">
            <input type="checkbox" ${dish.available ? "checked" : ""} onchange="updateDishBoolean(${index}, 'available', this.checked)" />
            <label>Available</label>
          </div>

          <div class="card-actions">
            <button class="btn" style="background:#e5e7eb;color:#111827;" onclick="duplicateDish(${index})">Duplicate</button>
            <button class="btn btn-danger" onclick="removeDish(${index})">Delete</button>
          </div>
        `;

        container.appendChild(card);
      });
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function updateDish(index, field, value) {
      dishesState[index][field] = value;
      if (field === "name") renderCards();
    }

    function updateDishNumber(index, field, value) {
      dishesState[index][field] = value === "" ? null : Number(value);
      renderCards();
    }

    function updateDishBoolean(index, field, value) {
      dishesState[index][field] = Boolean(value);
    }

    function updateDishTags(index, value) {
      dishesState[index].tags = value
        .split(",")
        .map(v => v.trim())
        .filter(Boolean);
    }

    function removeDish(index) {
      dishesState.splice(index, 1);
      renderCards();
    }

    function duplicateDish(index) {
      const cloned = structuredClone(dishesState[index]);
      dishesState.splice(index + 1, 0, cloned);
      renderCards();
    }

    function addDish() {
      dishesState.push({
        name: "",
        description: "",
        price: null,
        category: "",
        image_url: "",
        available: true,
        tags: [],
        extraction_confidence: 0,
        extraction_source: "manual"
      });
      renderCards();
    }

    function toggleRaw() {
      const box = document.getElementById("rawJsonBox");
      box.classList.toggle("hidden");
    }

    async function parseImage() {
      const button = document.getElementById("parseBtn");
      const filename = document.getElementById("imageInput").value.trim();
      const statusText = document.getElementById("statusText");
      const rawBox = document.getElementById("rawJsonBox");

      if (!filename) {
        statusText.textContent = "Write a filename first.";
        return;
      }

      button.disabled = true;
      button.textContent = "Parsing...";
      statusText.textContent = "Calling Gemini and parsing menu image...";

      try {
        const res = await fetch(
          "http://127.0.0.1:8000/parse_image?filename=" + encodeURIComponent(filename),
          { method: "POST" }
        );

        const data = await res.json();
        rawResponse = data;
        rawBox.textContent = JSON.stringify(data, null, 2);

        let parsedPayload = data;

        if (data.text) {
          try {
            parsedPayload = JSON.parse(data.text);
          } catch {
            parsedPayload = data;
          }
        }

        const dishes = parsedPayload.dishes || data.dishes || [];
        dishesState = Array.isArray(dishes) ? dishes : [];

        renderCards();
        statusText.textContent = `AI response received. Review ${dishesState.length} dishes before saving.`;

      } catch (err) {
        statusText.textContent = "Error while parsing image.";
        document.getElementById("rawJsonBox").textContent = "Error: " + err;
      }

      button.disabled = false;
      button.textContent = "Parse Menu";
    }

    async function saveDishes() {
      const saveBtn = document.getElementById("saveBtn");
      const statusText = document.getElementById("statusText");

      saveBtn.disabled = true;
      saveBtn.textContent = "Saving...";
      statusText.textContent = "Saving dishes to database...";

      try {
        const res = await fetch("http://127.0.0.1:8000/dishes/save", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            dishes: dishesState
          })
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.detail || "Failed to save dishes");
        }

        statusText.textContent = "Dishes saved successfully.";
      } catch (err) {
        statusText.textContent = "Save failed: " + err.message;
      }

      saveBtn.disabled = false;
      saveBtn.textContent = "Guardar";
    }

    renderCards();
  </script>
</body>
</html>
